name: Refresh and publish dashboard

on:
  schedule:
    - cron: "0 20 * * *"   # every day at 20:00 UTC (03:00 WIB)
  workflow_dispatch:        # "Run workflow" button for an update now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("data.table", "jsonlite"))'

      - name: Download and aggregate the latest data
        if: github.event_name != 'push'
        env:
          RARE_API_KEY: ${{ secrets.RARE_API_KEY }}
          RARE_DATASET_ID: ${{ vars.RARE_DATASET_ID }}
        run: Rscript build_data.R

      - name: Save the new data in the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            # Take in any edits made on GitHub while this was running, then save
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
